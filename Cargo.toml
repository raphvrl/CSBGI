[package]
name = "csbgi"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30.13"

wgpu = "30.0.1"
pollster = "1.0.1"

egui = "0.36.2"
egui-winit = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }

tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.104"

glam = { version = "0.33.7", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }

wesl = "0.4.4"

hecs = "0.11.1"
gltf = "1.4.1"
rayon = "1.12.0"

meshopt = "0.6.2"

[build-dependencies]
wesl = "0.4.4"

[profile.dev.package."*"]
opt-level = 3
